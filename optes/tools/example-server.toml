# Example template for make-space.py

name = "Home"
topic = "Our server"
channels = ["lobby"]

[[category]]
name = "General"
channels = ["chat", "links", "media"]
retention = "30d"               # General's channels forget after 30 days

[[category]]
name = "Projects"
channels = ["matrix-server", "drones"]

[[category]]
name = "Staff"
private = true
channels = ["mods"]

[[channel]]
name = "announcements"
category = "General"
read_only = true
topic = "News from the admins"
retention = "forever"           # overrides the category

[[channel]]
name = "rules"                  # no retention anywhere above: kept forever
read_only = true
