[package]
name = "optes-tunnel-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
optes-tunnel = { path = ".." }
tokio = { version = "1", features = ["rt", "io-util", "macros"] }
ed25519-dalek = "2"

[[bin]]
name = "cell_decode"
path = "fuzz_targets/cell_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frontlist_verify"
path = "fuzz_targets/frontlist_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gateway_handshake"
path = "fuzz_targets/gateway_handshake.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transport_open"
path = "fuzz_targets/transport_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session_cells"
path = "fuzz_targets/session_cells.rs"
test = false
doc = false
bench = false
